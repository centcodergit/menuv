    <!--
      Theme, language and motion preference are applied before first paint so there is no flash.
      Keys: menuverse-theme (dark|light, default dark), menuverse-lang, menuverse-reduce-motion.
    -->
    <script>
      (function () {
        try {
          var d = document.documentElement;
          var theme = localStorage.getItem("menuverse-theme");
          if (theme === "light") d.classList.remove("dark");
          else d.classList.add("dark");
          var langs = ["el", "en", "de", "fr", "es", "it", "pt", "nl"];
          var lang = localStorage.getItem("menuverse-lang");
          if (langs.indexOf(lang) === -1) {
            var nav = (navigator.language || "el").slice(0, 2).toLowerCase();
            lang = langs.indexOf(nav) !== -1 ? nav : "el";
          }
          d.lang = lang;
          if (localStorage.getItem("menuverse-reduce-motion") === "true") d.setAttribute("data-reduce-motion", "true");
        } catch (e) {}
      })();
    </script>
